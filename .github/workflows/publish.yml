name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a tag such as v2.0.0\n' >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Test and package the universal app
        shell: bash
        run: |
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)
          [[ "v$version" == "$RELEASE_TAG" ]]
          xcrun swift test --disable-xctest
          ./release.sh

      - name: Attach verified archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd build
          archive="ClickHarbor-${RELEASE_TAG#v}-macOS-universal.zip"
          /usr/bin/shasum -a 256 -c "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY"
