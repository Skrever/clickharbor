name: Publish macOS release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a tag such as v2.0.0\n' >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Test and package the universal app
        shell: bash
        run: |
          version=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)
          [[ "v$version" == "$RELEASE_TAG" ]]
          xcrun swift test --disable-xctest
          ./release.sh

      - name: Publish verified macOS downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd build
          base="ClickHarbor-${RELEASE_TAG#v}-macOS-universal"
          for extension in dmg zip; do
            /usr/bin/shasum -a 256 -c "$base.$extension.sha256"
          done
          assets=("$base.dmg" "$base.dmg.sha256" "$base.zip" "$base.zip.sha256")
          if existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            missing=()
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "$asset" <<< "$existing"; then
                missing+=("$asset")
              fi
            done
            if (( ${#missing[@]} )); then
              gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "ClickHarbor ${RELEASE_TAG#v}"
          fi
